name: Test on branch push
on: push

jobs:
  test:

    runs-on: ubuntu-latest
    env:
      NODE_ENV: 'PROD'

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: xvfb-run npm run test
        env: 
          DISPLAY: 99.0
          DBUS_SESSION_BUS_ADDRESS: '/dev/null'
